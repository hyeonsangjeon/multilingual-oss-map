<rect x="70" y="74" width="22" height="22" rx="5" fill="#4cc9f0"/><text x="104" y="92" font-size="26" font-family="DejaVu Sans Mono, Liberation Mono, monospace" fill="#6b7c96" font-weight="700" text-anchor="start" letter-spacing="3">MULTILINGUAL-OSS-MAP</text><text x="1130" y="92" font-size="22" font-family="DejaVu Sans Mono, Liberation Mono, monospace" fill="#6b7c96" font-weight="400" text-anchor="end">hyeonsangjeon.github.io/multilingual-oss-map</text><text x="70" y="190" font-size="54" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" fill="#e8edf5" font-weight="800" text-anchor="start">Do developers document in English,</text><text x="70" y="258" font-size="54" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" font-weight="800" fill="#e8edf5">but discuss in their <tspan fill="#ffd166">mother tongue</tspan>?</text><text x="70" y="322" font-size="31" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" fill="#9fb0c8" font-weight="400" text-anchor="start">Korean is #5 in READMEs — but #1 in issue conversation.</text><rect x="70.0" y="360" width="337.3" height="150" rx="18" fill="#121826" stroke="#263248" stroke-width="1.5"/><text x="96.0" y="404" font-size="23" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" fill="#4cc9f0" font-weight="700" text-anchor="start" letter-spacing="1">REPOSITORIES</text><text x="96.0" y="466" font-size="58" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" fill="#e8edf5" font-weight="800" text-anchor="start">40M+</text><text x="96.0" y="500" font-size="25" font-family="DejaVu Sans Mono, Liberation Mono, monospace" fill="#9fb0c8" font-weight="400" text-anchor="start">in the dataset</text><rect x="431.3" y="360" width="337.3" height="150" rx="18" fill="#121826" stroke="#263248" stroke-width="1.5"/><text x="457.3333333333333" y="404" font-size="23" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" fill="#6ee7a8" font-weight="700" text-anchor="start" letter-spacing="1">CLASSIFIERS</text><text x="457.3333333333333" y="466" font-size="58" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" fill="#e8edf5" font-weight="800" text-anchor="start">3</text><text x="457.3333333333333" y="500" font-size="25" font-family="DejaVu Sans Mono, Liberation Mono, monospace" fill="#9fb0c8" font-weight="400" text-anchor="start">all must agree</text><rect x="792.7" y="360" width="337.3" height="150" rx="18" fill="#121826" stroke="#263248" stroke-width="1.5"/><text x="818.6666666666666" y="404" font-size="23" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" fill="#ffb703" font-weight="700" text-anchor="start" letter-spacing="1">AGREEMENT</text><text x="818.6666666666666" y="466" font-size="58" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" fill="#e8edf5" font-weight="800" text-anchor="start">99.8%</text><text x="818.6666666666666" y="500" font-size="25" font-family="DejaVu Sans Mono, Liberation Mono, monospace" fill="#9fb0c8" font-weight="400" text-anchor="start">both non-English</text><text x="70" y="588" font-size="23" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" fill="#6b7c96" font-weight="400" text-anchor="start">Built from the GitHub Multilingual Repositories Dataset (CC0) · English excluded</text>
